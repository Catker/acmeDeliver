# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: acmeDeliver

before:
  hooks:
    - go mod tidy

builds:
  # 服务端构建
  - id: server
    binary: acmedeliver-server
    main: ./cmd/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

  # 客户端构建
  - id: client
    binary: acmedeliver-client
    main: ./cmd/client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - config.yaml.example
      - client-config.yaml.example

checksum:
  name_template: 'checksums.txt'

changelog:
  use: github
  groups:
    - title: "✨ 新功能"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug 修复"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "📚 文档"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "🔧 其他"
      order: 999

release:
  github:
    owner: Catker
    name: acmeDeliver
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"